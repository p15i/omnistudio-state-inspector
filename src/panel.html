<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px;
        border-bottom: 1px solid #ccc;
        background: #f5f5f5;
        flex-wrap: wrap;
      }
      #view-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        flex: 1 1 auto;
      }
      #edit-controls {
        display: none;
        align-items: center;
        gap: 6px;
      }
      #query-btn,
      #older-btn,
      #newer-btn,
      #copy-btn,
      #edit-btn,
      #save-btn,
      #cancel-btn,
      #snapshot-select {
        padding: 3px 6px;
        cursor: pointer;
        font-size: 11px;
        box-sizing: border-box;
      }
      #older-btn,
      #newer-btn {
        padding: 3px 6px;
      }
      #older-btn:disabled,
      #newer-btn:disabled {
        cursor: default;
        opacity: 0.4;
      }
      /* Right-align the monitor checkbox */
      #monitor-label {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
      }
      #output,
      #editor {
        flex: 1 1 auto;
        width: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 8px;
        border: var(--focus-border-width, 3px) solid transparent;
        outline: none;
        overflow: auto;
        background: #fff;
        color: #1e1e1e;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre;
        tab-size: 2;
      }
      #output:focus {
        border-color: var(--focus-border-color, #1a73e8);
      }
      #editor {
        display: none;
        resize: none;
      }
      #edit-error {
        display: none;
        padding: 4px 8px;
        color: #b00020;
        background: #fdecea;
        font-size: 12px;
        border-bottom: 1px solid #f5c6cb;
      }
      /* JSON token colours (light theme) */
      #output .json-key     { color: #0451a5; }
      #output .json-string  { color: #a31515; }
      #output .json-number  { color: #098658; }
      #output .json-null    { color: #808080; font-style: italic; }
      #output .json-true    { color: #098658; }
      #output .json-false   { color: #d97706; }
      #output .json-punct   { color: #333333; }
      /* Diff highlight (colour comes from --diff-highlight, set in JS) */
      #output .diff-changed {
        background-color: var(--diff-highlight, #fff3a8);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div id="view-controls">
        <button id="query-btn">Query OmniScript State</button>
		&nbsp;&nbsp;&nbsp;&nbsp;
        <select id="snapshot-select" title="Select snapshot" style="display: none;"></select>
        <button id="older-btn" title="Older snapshot" style="display: none;">&#9664;</button>
        <button id="newer-btn" title="Newer snapshot" style="display: none;">&#9654;</button>
		&nbsp;&nbsp;
        <button id="edit-btn" title="Edit snapshot JSON" style="display: none;">Edit</button>
		&nbsp;&nbsp;&nbsp;&nbsp;
		<button id="copy-btn" title="Copy snapshot to clipboard" style="display: none;">📋 Copy</button>
        <label id="monitor-label" style="display: none;">
          <input type="checkbox" id="monitor-checkbox" />
          Monitor state changes
        </label>
      </div>
      <div id="edit-controls">
        <button id="save-btn">Save</button>
        <button id="cancel-btn">Cancel</button>
      </div>
    </div>
    <div id="edit-error"></div>
    <pre id="output" tabindex="0" spellcheck="false"></pre>
    <textarea id="editor" spellcheck="false"></textarea>
    <script src="panel.js"></script>
  </body>
</html>
